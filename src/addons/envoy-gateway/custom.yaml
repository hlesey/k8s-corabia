---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: host-port-config
  namespace: envoy-gateway
spec:
  provider:
    type: Kubernetes
    kubernetes:
      useListenerPortAsContainerPort: true
      envoyDeployment:
        replicas: 1 # Scale based on available control plane nodes
        container:
          securityContext:
            allowPrivilegeEscalation: true
            runAsNonRoot: false
            runAsUser: 0
        patch:
          type: StrategicMerge
          value:
            spec:
              template:
                spec:
                  hostNetwork: true
                  dnsPolicy: ClusterFirstWithHostNet
                  containers:
                  - name: envoy
                    ports:
                    - name: http
                      containerPort: 80
                      hostPort: 80 # Binds to Node Public IP port 80
                      protocol: TCP
                    - name: https
                      containerPort: 443
                      hostPort: 443 # Binds to Node Public IP port 443
                      protocol: TCP
                    # Needed if using ports < 1024 on some K8s distributions
                    securityContext:
                      capabilities:
                        add: ["NET_BIND_SERVICE"]
                  nodeSelector:
                    # Matches the label added by kubeadm to control plane nodes
                    node-role.kubernetes.io/control-plane: ""
                  tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
                  - key: node-role.kubernetes.io/master
                    operator: Exists
                    effect: NoSchedule
                  # REQUIRED: Prevents 2 pods from landing on 1 node (Port Conflict)
                  affinity:
                    podAntiAffinity:
                      requiredDuringSchedulingIgnoredDuringExecution:
                      - labelSelector:
                          matchLabels:
                            # Matches the label Envoy Gateway adds to its managed proxy pods
                            gateway.envoyproxy.io/owning-gateway-name: envoy-gateway
                        topologyKey: "kubernetes.io/hostname"
      envoyService:
        type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: host-port-config
    namespace: envoy-gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # port 80 only admits the redirect route below; app routes attach to https
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
        - kind: Secret
          name: envoy-gateway-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: envoy-gateway
spec:
  parentRefs:
  - name: envoy-gateway
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
# Listeners share one certificate, so Envoy Gateway drops h2 from ALPN by default;
# HTTP/1.1 caps the browser at 6 connections so switch to h2.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: enable-h2
  namespace: envoy-gateway
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-gateway
  tls:
    alpnProtocols:
    - h2
    - http/1.1
