apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: dashboard
spec:
  parentRefs:
  - name: envoy-gateway
    namespace: envoy-gateway
    sectionName: https
  hostnames:
  - dashboard.clusterx.qedzone.ro
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: kubernetes-dashboard-web
      port: 8000
  - matches:
    - path:
        type: Exact
        value: /api/v1/login
    - path:
        type: Exact
        value: /api/v1/csrftoken/login
    - path:
        type: Exact
        value: /api/v1/me
    - path:
        type: Exact
        value: /api/v1/healthz
    backendRefs:
    - name: kubernetes-dashboard-auth
      port: 8000
  - matches:
    - path:
        type: PathPrefix
        value: /api
    - path:
        type: PathPrefix
        value: /metrics
    backendRefs:
    - name: kubernetes-dashboard-api
      port: 8000
